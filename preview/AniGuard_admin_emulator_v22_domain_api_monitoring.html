<!doctype html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>AniGuard Admin — панель владельца</title>
<style>
:root{
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  --radius: 24px;
  --shadow: 0 18px 48px rgba(0,0,0,.16);
  --transition: .18s ease;
  --font: -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,Arial,sans-serif;
}
html[data-theme="dark"]{
  --bg:#0e1117;
  --bg-2:#151b24;
  --card:#1a212c;
  --card-2:#212a36;
  --card-soft:#253142;
  --text:#f3f6fb;
  --muted:#97a4b6;
  --line:#2d3a4c;
  --accent:#36a3e7;
  --accent-2:#2486d1;
  --accent-soft:rgba(54,163,231,.17);
  --success:#3ec48b;
  --success-soft:rgba(62,196,139,.16);
  --warning:#f1b44c;
  --warning-soft:rgba(241,180,76,.15);
  --danger:#ff6e7c;
  --danger-soft:rgba(255,110,124,.16);
  --info:#86b7ff;
  --info-soft:rgba(134,183,255,.16);
}
html[data-theme="light"]{
  --bg:#eef2f6;
  --bg-2:#f6f8fb;
  --card:#ffffff;
  --card-2:#f8fafc;
  --card-soft:#f2f6fa;
  --text:#111827;
  --muted:#6b7789;
  --line:#d7e0ea;
  --accent:#198bd6;
  --accent-2:#0f77bc;
  --accent-soft:rgba(25,139,214,.12);
  --success:#1f9f6d;
  --success-soft:rgba(31,159,109,.12);
  --warning:#c68819;
  --warning-soft:rgba(198,136,25,.12);
  --danger:#dd5568;
  --danger-soft:rgba(221,85,104,.12);
  --info:#4f86ff;
  --info-soft:rgba(79,134,255,.12);
}

.resource-live{display:grid;gap:10px}
.resource-status{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px;border:1px solid var(--line);border-radius:22px;background:var(--card)}
.resource-status strong{font-size:16px}.resource-status small{color:var(--muted)}
.resource-dot{width:10px;height:10px;border-radius:50%;background:var(--success);box-shadow:0 0 0 5px var(--success-soft)}
.resource-dot.degraded{background:var(--warning);box-shadow:0 0 0 5px var(--warning-soft)}
.resource-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.resource-card{padding:14px;border:1px solid var(--line);border-radius:22px;background:var(--card)}
.resource-card-head{display:flex;align-items:center;justify-content:space-between;gap:10px}.resource-card small{color:var(--muted)}.resource-card b{font-size:21px}
.resource-bar{height:8px;border-radius:999px;background:var(--card-soft);overflow:hidden;margin-top:12px}.resource-bar span{display:block;height:100%;width:0;background:var(--accent);border-radius:inherit;transition:width .3s ease}.resource-bar.warning span{background:var(--warning)}.resource-bar.danger span{background:var(--danger)}
.operation-card{position:relative;padding-top:44px}.operation-number{position:absolute;left:14px;top:14px;min-width:26px;height:26px;padding:0 7px;border-radius:10px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);font-size:12px;font-weight:900}
.operation-state{position:absolute;right:14px;top:17px;font-size:11px;font-weight:800;color:var(--success)}
.live-timestamp{font-variant-numeric:tabular-nums}
@media(max-width:520px){.resource-grid{grid-template-columns:1fr}.operation-card{padding-top:42px}}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:var(--font);font-style:normal;text-rendering:optimizeLegibility}
body{min-width:320px}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
a{text-decoration:none;color:inherit}
.hidden{display:none !important}
svg{display:block}
.app-shell{width:min(100%,780px);margin:0 auto;padding:14px 14px calc(116px + var(--safe-bottom))}
.topbar{
  position:sticky;top:0;z-index:30;margin:0 -14px 12px;padding:8px 14px 12px;
  display:flex;align-items:center;gap:10px;justify-content:space-between;
  background:linear-gradient(to bottom, color-mix(in srgb,var(--bg) 96%, transparent), color-mix(in srgb,var(--bg) 84%, transparent));
  backdrop-filter:blur(18px)
}
.topbar-left{
  min-width:0;display:flex;align-items:center;gap:12px;flex:1
}
.topbar-actions{display:flex;gap:10px;align-items:center;justify-content:flex-end;flex:0 0 auto}
.icon-btn{
  width:46px;height:46px;border-radius:17px;border:1px solid var(--line);
  background:var(--card);display:grid;place-items:center;transition:var(--transition);
  box-shadow:0 8px 18px rgba(0,0,0,.08)
}
.refresh-btn{
  position:relative;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:0;
  line-height:0;
}
.refresh-btn svg{
  position:absolute;
  left:50%;
  top:50%;
  width:21px;
  height:21px;
  display:block;
  margin:0;
  stroke-width:2.15;
  transform:translate(-50%,-50%);
  transform-origin:center;
}

.icon-btn:active{transform:scale(.97);background:var(--card-soft)}
.icon-btn svg{width:22px;height:22px;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.admin-chip{
  border:0;background:none;padding:0;display:flex;align-items:center;gap:12px;min-width:0;text-align:left
}
.avatar{
  position:relative;flex:0 0 54px;width:54px;height:54px;border-radius:18px;
  display:grid;place-items:center;overflow:hidden;
  background:linear-gradient(160deg,var(--accent),#5fd6ff);
  color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.18), 0 8px 24px rgba(0,0,0,.14)
}
.avatar small{position:absolute;right:4px;bottom:4px;width:18px;height:18px;border-radius:50%;background:#0d1320;color:#fff;display:grid;place-items:center;font-size:10px;border:1px solid rgba(255,255,255,.18)}
.avatar.admin svg{width:28px;height:28px}
.avatar img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:inherit;z-index:2}
.avatar img + small{z-index:3}
.admin-title{font-size:20px;font-weight:800;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.admin-sub{margin-top:3px;font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.search-wrap{
  display:flex;align-items:center;gap:10px;min-height:54px;margin-bottom:16px;padding:0 16px;
  border-radius:22px;border:1px solid var(--line);background:var(--card)
}
.search-wrap svg{width:20px;height:20px;stroke:var(--muted);stroke-width:2;fill:none}
.search-wrap input{
  width:100%;border:0;outline:0;background:transparent;color:var(--text)
}
.page{display:none}
.page.active{display:block}
.section-head{
  margin:22px 2px 10px;display:flex;align-items:center;justify-content:space-between;gap:12px
}
.section-head h2{
  margin:0;font-size:19px;line-height:1.2;font-weight:800;letter-spacing:-.01em
}
.section-head span{font-size:13px;color:var(--muted)}
.metrics{
  display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px
}
.metric{
  padding:14px;border-radius:22px;border:1px solid var(--line);background:var(--card);
  box-shadow:0 1px 0 rgba(255,255,255,.02)
}
.metric small{display:block;color:var(--muted);font-size:12px}
.metric b{display:block;margin-top:6px;font-size:22px;line-height:1.15}
.metric em{display:block;margin-top:6px;font-size:11px;color:var(--accent);font-style:normal}
.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.card{
  padding:15px;border-radius:22px;border:1px solid var(--line);background:var(--card)
}
.card h3{margin:0 0 7px;font-size:17px;line-height:1.2}
.card p{margin:0;color:var(--muted);font-size:13px;line-height:1.5}
.card-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.primary,.secondary,.danger,.success,.ghost{
  min-height:46px;border-radius:15px;padding:11px 14px;border:1px solid var(--line);
  transition:var(--transition);font-weight:700
}
.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.secondary{background:var(--card-2)}
.success{background:var(--success-soft);border-color:color-mix(in srgb,var(--success) 25%, var(--line));color:var(--success)}
.danger{background:var(--danger-soft);border-color:color-mix(in srgb,var(--danger) 25%, var(--line));color:var(--danger)}
.ghost{background:transparent}
.primary:active,.secondary:active,.success:active,.danger:active,.ghost:active{transform:scale(.985)}
.list{
  overflow:hidden;border-radius:24px;border:1px solid var(--line);background:var(--card)
}
.row{
  width:100%;display:grid;grid-template-columns:46px minmax(0,1fr) auto;gap:12px;align-items:center;
  padding:14px;border:0;border-bottom:1px solid var(--line);background:transparent;text-align:left
}
.row:last-child{border-bottom:0}
.row-icon{
  width:46px;height:46px;border-radius:16px;display:grid;place-items:center;
  background:var(--accent-soft);color:var(--accent)
}
.row-icon svg{width:24px;height:24px;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.row-copy{min-width:0}
.row-title{
  display:block;font-size:16px;font-weight:760;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis
}
.row-sub{
  display:block;margin-top:5px;font-size:13px;color:var(--muted);line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis
}
.row-extra{display:flex;align-items:center;justify-content:flex-end;gap:8px;flex:0 0 auto}
.badge{
  display:inline-block;
  padding:0;
  margin:0;
  background:transparent;
  border:none;
  border-radius:0;
  font-size:12px;
  font-weight:700;
  color:var(--muted);
  white-space:nowrap;
  line-height:1.2;
  text-align:right;
  box-sizing:border-box;
}
.badge.success,
.badge.warning,
.badge.info,
.badge.danger,
.badge.muted{
  background:transparent !important;
  border:none !important;
  color:var(--muted) !important;
}
.chat-list{
  display:grid;gap:10px
}
.chat-card{
  padding:14px;border-radius:26px;border:1px solid var(--line);background:var(--card)
}
.chat-top{
  display:grid;grid-template-columns:56px minmax(0,1fr);gap:12px;align-items:center
}
.chat-meta{min-width:0}
.chat-name{
  font-size:18px;font-weight:800;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  font-style:normal;letter-spacing:0
}
.chat-id,.chat-link{
  display:block;margin-top:4px;font-size:13px;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis
}
.chat-id{color:var(--muted)}
.chat-link{color:var(--accent);font-weight:650}
.chat-actions{
  display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin-top:14px
}
.action-btn{
  min-height:48px;border-radius:15px;border:1px solid var(--line);background:var(--card-2);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:7px 5px;transition:var(--transition)
}
.action-btn:active{transform:scale(.98)}
.action-btn svg{width:18px;height:18px;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.action-btn span{display:block;font-size:10px;font-weight:760;line-height:1.1;color:var(--text)}
.action-btn.info{color:var(--info);background:var(--info-soft)}
.action-btn.premium{color:var(--success);background:var(--success-soft)}
.action-btn.control{color:var(--warning);background:var(--warning-soft)}
.action-btn.settings{color:var(--accent);background:var(--accent-soft)}
.action-btn.log{color:var(--danger);background:var(--danger-soft)}

.user-table{
  display:grid;gap:10px
}
.user-card{
  padding:14px;border-radius:24px;border:1px solid var(--line);background:var(--card)
}
.user-head{
  display:grid;grid-template-columns:52px minmax(0,1fr);gap:12px;align-items:center
}
.user-name{font-size:17px;font-weight:800;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.user-id,.user-username{display:block;margin-top:4px;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.user-id{font-size:12px;color:var(--muted)}
.user-username{font-size:13px;color:var(--accent);font-weight:650}
.user-actions{
  margin-top:13px;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px
}
.tool-btn{
  min-height:48px;border-radius:15px;border:1px solid var(--line);background:var(--card-2);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:7px 5px;transition:var(--transition)
}
.tool-btn svg{width:18px;height:18px;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.tool-btn span{font-size:10px;font-weight:760}
.tool-btn.info{color:var(--info)}
.tool-btn.premium{color:var(--success)}
.tool-btn.coin{color:var(--warning)}
.tool-btn.ref{color:var(--accent)}
.tool-btn.block{color:var(--danger)}
.sheet-backdrop{
  display:none;position:fixed;inset:0;z-index:60;padding:12px;background:rgba(0,0,0,.45);align-items:flex-end
}
.sheet-backdrop.open{display:flex}
.sheet{
  width:min(100%,720px);max-height:calc(100vh - 24px);margin:0 auto;overflow:auto;
  border-radius:30px;border:1px solid var(--line);background:var(--bg-2);box-shadow:var(--shadow)
}
.sheet-handle{width:58px;height:5px;border-radius:999px;background:var(--line);margin:12px auto 0}
.sheet-head{
  padding:16px 16px 10px;display:flex;align-items:flex-start;justify-content:space-between;gap:12px
}
.sheet-title{margin:0;font-size:22px;line-height:1.15;font-weight:820}
.sheet-sub{margin:6px 0 0;font-size:13px;color:var(--muted);line-height:1.4}
.sheet-body{padding:0 16px 18px}
.close-btn{
  width:42px;height:42px;border-radius:16px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center
}
.close-btn svg{width:20px;height:20px;stroke:currentColor;stroke-width:2;fill:none}
.profile-hero{
  display:grid;grid-template-columns:72px minmax(0,1fr);gap:14px;align-items:center;
  padding:14px;border-radius:24px;border:1px solid var(--line);background:var(--card)
}
.profile-hero .avatar{width:72px;height:72px;border-radius:22px;flex:0 0 72px}
.profile-hero .avatar.admin svg{width:38px;height:38px}
.profile-name{
  font-size:22px;font-weight:850;line-height:1.18;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-style:normal
}
.profile-id,.profile-username{display:block;margin-top:4px;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.profile-id{font-size:13px;color:var(--muted)}
.profile-username{font-size:14px;color:var(--accent);font-weight:700}
.facts{
  display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:14px
}
.fact{
  padding:14px;border-radius:20px;border:1px solid var(--line);background:var(--card)
}
.fact small{display:block;font-size:12px;color:var(--muted)}
.fact b{display:block;margin-top:6px;font-size:18px;line-height:1.2}
.form{display:grid;gap:12px}
.search-inline{
  display:flex;align-items:center;gap:10px;min-height:48px;padding:0 14px;
  border-radius:16px;border:1px solid var(--line);background:var(--card)
}
.search-inline svg{width:18px;height:18px;stroke:var(--muted);stroke-width:2;fill:none}
.search-inline input{width:100%;border:0;outline:0;background:transparent;color:var(--text)}
.hidden-field{display:none}

.field{display:grid;gap:7px}
.field label{font-size:14px;font-weight:700}
.field input,.field select,.field textarea{
  width:100%;padding:12px 13px;border-radius:16px;border:1px solid var(--line);background:var(--card);outline:0
}
.field textarea{min-height:110px;resize:vertical}
.inline{
  display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px
}
.console{
  padding:14px;border-radius:20px;border:1px solid var(--line);background:#0f141c;color:#ced7e3;
  white-space:pre-wrap;font-size:12px;line-height:1.6;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace
}
.bottom-nav{
  position:fixed;left:50%;bottom:calc(10px + var(--safe-bottom));transform:translateX(-50%);
  width:min(640px,calc(100% - 20px));z-index:40;padding:7px;display:grid;
  grid-template-columns:repeat(5,minmax(0,1fr));gap:4px;border-radius:32px;border:1px solid var(--line);
  background:color-mix(in srgb,var(--card) 94%, transparent);backdrop-filter:blur(18px);box-shadow:var(--shadow)
}
.nav-btn{
  min-height:70px;border-radius:25px;border:0;background:transparent;color:var(--muted);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;transition:var(--transition)
}
.nav-btn svg{width:24px;height:24px;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.nav-btn span{font-size:11px;font-weight:760}
.nav-btn.active{background:var(--accent-soft);color:var(--accent)}
.auth-screen{
  min-height:100vh;display:grid;place-items:center;padding:20px
}
.auth-card{
  width:min(100%,430px);padding:24px;border-radius:30px;border:1px solid var(--line);background:var(--card);box-shadow:var(--shadow)
}
.auth-top{
  display:flex;align-items:center;gap:14px
}
.auth-title{font-size:28px;font-weight:850;line-height:1.1}
.auth-text{margin:4px 0 0;font-size:14px;color:var(--muted);line-height:1.5}
.auth-error{min-height:20px;margin-top:10px;font-size:13px;color:var(--danger);text-align:center}
.switch-row{
  display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;border-radius:18px;border:1px solid var(--line);background:var(--card)
}
.switch-copy b{display:block;font-size:15px}
.switch-copy span{display:block;margin-top:4px;font-size:13px;color:var(--muted)}
.switch{
  position:relative;width:52px;height:31px;flex:0 0 52px
}
.switch input{position:absolute;inset:0;opacity:0}
.switch span{
  position:absolute;inset:0;border-radius:999px;background:var(--line);transition:var(--transition)
}
.switch span:after{
  content:"";position:absolute;top:3px;left:3px;width:25px;height:25px;border-radius:50%;background:#fff;transition:var(--transition)
}
.switch input:checked + span{background:var(--accent)}
.switch input:checked + span:after{transform:translateX(21px)}
.toast{
  position:fixed;left:50%;bottom:96px;transform:translate(-50%,10px);z-index:100;
  padding:12px 14px;border-radius:16px;border:1px solid var(--line);background:var(--card);box-shadow:var(--shadow);
  opacity:0;pointer-events:none;transition:var(--transition);max-width:calc(100% - 28px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis
}
.toast.show{opacity:1;transform:translate(-50%,0)}
.mini-list{display:grid;gap:8px;margin-top:14px}
.pill{
  display:inline-flex;align-items:center;gap:8px;padding:8px 10px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-size:12px;font-weight:700
}
.kpi-row{display:flex;flex-wrap:wrap;gap:8px}
@media (max-width:700px){
  .metrics{grid-template-columns:repeat(2,minmax(0,1fr))}
  .cards,.inline,.facts{grid-template-columns:1fr}
}
@media (max-width:520px){
  .chat-actions,.user-actions{grid-template-columns:repeat(3,minmax(0,1fr))}
  .topbar{padding-top:10px}
  .admin-title{font-size:18px}
  .section-head h2{font-size:18px}
}
@media (max-width:420px){
  .metrics{grid-template-columns:1fr}
  .badge{font-size:11px}
}
.auth-card .field,.auth-card .switch-row{display:none}

.store-kpi-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.store-kpi{padding:14px;border:1px solid var(--line);border-radius:20px;background:var(--card)}
.store-kpi small{display:block;color:var(--muted);font-size:12px}.store-kpi b{display:block;margin-top:6px;font-size:22px}
.admin-thread{display:grid;gap:10px;max-height:330px;overflow:auto;padding:8px;border:1px solid var(--line);border-radius:20px;background:var(--bg-2)}
.admin-message{max-width:88%;padding:11px 13px;border-radius:17px;background:var(--card);line-height:1.45}.admin-message.support{margin-left:auto;background:var(--accent-soft)}
.admin-message small{display:block;margin-top:5px;color:var(--muted);font-size:11px}
.order-status{display:inline-flex;padding:6px 9px;border-radius:999px;font-size:11px;font-weight:800}.order-status.pending{color:var(--warning);background:var(--warning-soft)}.order-status.approved{color:var(--success);background:var(--success-soft)}.order-status.rejected{color:var(--danger);background:var(--danger-soft)}.order-status.paid{color:var(--accent);background:var(--accent-soft)}
.admin-store-row{display:grid;gap:8px;padding:14px;border:1px solid var(--line);border-radius:20px;background:var(--card)}
.admin-store-row-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.admin-store-row p{margin:0;color:var(--muted);font-size:13px;line-height:1.45}
.button-grid{display:grid;gap:10px}.button-grid.two{grid-template-columns:repeat(2,minmax(0,1fr))}
@media(max-width:520px){.store-kpi-grid,.button-grid.two{grid-template-columns:1fr}}

<script>
(() => {
  const $ = (s, root=document) => root.querySelector(s);
  const $$ = (s, root=document) => Array.from(root.querySelectorAll(s));
  const icon = (id) => `<svg viewBox="0 0 24 24"><use href="#${id}"></use></svg>`;
  const fmt = (n) => Number(n).toLocaleString('ru-RU');
  const initials = (name) => (name || '').split(/\s+/).slice(0,2).map(v => v[0] || '').join('').toUpperCase();
  const escapeHtml = (value) => String(value ?? '').replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[ch]));

  function avatarMarkup(name, avatarUrl='', admin=false){
    const fallback = admin
      ? `${icon('shield-star')}<small>AG</small>`
      : escapeHtml(initials(name));
    const image = avatarUrl
      ? `<img src="${escapeHtml(avatarUrl)}" alt="Аватар ${escapeHtml(name || 'AniGuard')}" loading="lazy" onerror="this.remove()">`
      : '';
    return `<div class="avatar${admin ? ' admin' : ''}">${fallback}${image}</div>`;
  }

  function updateAdminHeaderAvatar(){
    const node = $('#adminChip .avatar.admin');
    if (!node) return;
    node.outerHTML = avatarMarkup(data.admin.name || 'AniGuard Admin', data.admin.avatar_url || '', true);
  }

  const data = {
    admin: {name:'AniGuard Admin'},
    theme: localStorage.getItem('aniguard_admin_theme') || 'dark',
    loginAttempts: 0,
    lockUntil: 0,
    currentPage: 'overview',
    settings: {
      maintenance:false,
      registration:true,
      premiumInheritance:true,
      paymentNotify:true,
      autoReports:true,
      themeAuto:false,
      backupAlerts:true
    },
    users: [],
    chats: [],
    payments: [],
    reports: [],
    tickets: [],
    promos: [],
    logs: [],
    storeOverview: {pending_ads:0, open_tickets:0, case_openings:0, coin_sales_stars:0, ad_sales_stars:0, audience:{channel:0,bot:0,rewarded:0}},
    storeAds: [],
    supportTickets: [],
    caseOpenings: [],
    walletTransactions: [],
    resources: {provider:'starting',status:'starting',cpu_percent:0,cpu_limit:4,memory_usage_mb:0,memory_limit_mb:2048,memory_percent:0,disk_usage_mb:0,disk_limit_mb:15360,disk_percent:0,uptime:'—',updated_at:null,error:null},
    liveStats: {},
    liveIncidents: [],
    liveTimer: null,
    liveBusy: false
  };

  const tg = window.Telegram?.WebApp;

  function telegramInitData(){
    return tg?.initData || '';
  }

  function devUserId(){
    return new URLSearchParams(location.search).get('dev_user_id') || '';
  }

  const DEMO_MODE = true;
  const demoStartedAt = Date.now() - 3 * 86400000 - 5 * 3600000;
  const demoState = {
    cases:[{id:1,code:'AG-000001',chat_id:-1001234567890,target_id:741852963,actor_id:123456789,action:'mute',reason:'Оскорбление участника',duration_seconds:86400,status:'open',severity:'high',evidence_count:1,created_at:new Date(Date.now()-4200000).toISOString()}],
    appeals:[{id:1,case_id:1,chat_id:-1001234567890,user_id:741852963,text:'Наказание выдано по ошибке',status:'new',decision:null,decision_note:null,reviewer_id:null,created_at:new Date(Date.now()-1800000).toISOString()}],
    backups:[{id:1,chat_id:-1001234567890,kind:'automatic',checksum:'13f0a9b4c180d4b2e711',created_by:0,created_at:new Date(Date.now()-3600000).toISOString(),restored_at:null}],
    shifts:[{id:1,chat_id:-1001234567890,user_id:555111222,assigned_by:123456789,starts_at:new Date(Date.now()-3600000).toISOString(),ends_at:new Date(Date.now()+7200000).toISOString(),temporary_role:'moderator',status:'active',reports_handled:8,warnings_issued:4,mutes_issued:1}],
  };

  function demoResources(){
    const tick=Date.now()/1000;
    const cpu=18+Math.sin(tick/2.7)*9+Math.sin(tick/7)*4;
    const memory=648+Math.sin(tick/5)*34;
    const disk=2960;
    const uptime=Math.floor((Date.now()-demoStartedAt)/1000);
    const days=Math.floor(uptime/86400), hours=Math.floor((uptime%86400)/3600), minutes=Math.floor((uptime%3600)/60);
    return {provider:'cgroup',status:'online',cpu_percent:Math.max(1,cpu),cpu_limit:4,cpu_source:'cgroup-v2',memory_usage_mb:memory,memory_limit_mb:2048,memory_percent:memory/2048*100,memory_source:'cgroup-v2',disk_usage_mb:disk,disk_limit_mb:15360,disk_percent:disk/15360*100,uptime_seconds:uptime,uptime:`${days} дн. ${hours} ч. ${minutes} мин.`,updated_at:new Date().toISOString(),latency_ms:1,error:null};
  }

  function demoDashboard(){
    return {
      admin:{id:123456789,name:'AniGuard Admin',username:'aniguard_owner',avatar_url:null},
      stats:{users:18420,active24:6380,active7:11320,chats:86,premiumUsers:1320,premiumChats:44,expiringPremium:31,revenue:8420,aniCoin:1284000,reports:7},
      users:[],
      chats:[{id:-1001234567890,name:'AniGuard Community',title:'AniGuard Community',members:8421,active7:3184,botStatus:'Активен',antiSpam:true,captcha:true,premium:true,premiumUntil:new Date(Date.now()+30*86400000).toISOString(),owner:'@aniguard_owner',username:'aniguard_chat',created:new Date(Date.now()-300*86400000).toISOString()}],
      payments:[],
      reports:[{id:'REP-12',rawId:12,type:'Жалоба · спам',text:'Повторная реклама',status:'Новая',chatId:-1001234567890,userId:111,targetId:222,duplicates:4,date:new Date(Date.now()-900000).toISOString()}],
      tickets:[],promos:[],logs:[],
      settings:{maintenance:false,registration:true,premiumInheritance:true,paymentNotify:true,autoReports:true,themeAuto:false,backupAlerts:true}
    };
  }

  async function demoApi(path, options={}){
    await new Promise(resolve=>setTimeout(resolve,35));
    const method=(options.method||'GET').toUpperCase();
    if(path==='/api/me') return {is_bot_admin:true,id:123456789};
    if(path==='/api/admin/dashboard') return demoDashboard();
    if(path==='/api/admin/store/overview') return {pending_ads:3,open_tickets:2,case_openings:128,coin_sales_stars:1420,ad_sales_stars:620,audience:{channel:12000,bot:18420,rewarded:6380}};
    if(path==='/api/admin/live') return {ok:true,server_time:new Date().toISOString(),refresh_interval_ms:1000,stats:{users:18420,active24:6380,chats:86,reports:7,cases:demoState.cases.filter(x=>x.status==='open').length,appeals:demoState.appeals.filter(x=>x.status==='new').length,securityAlerts:1,activeShifts:1,probations:1},resources:demoResources(),incidents:[{id:1,chat_id:-1001234567890,kind:'anti_raid',severity:'warning',actor_id:null,created_at:new Date(Date.now()-600000).toISOString()}]};
    if(path.startsWith('/api/admin/system/resources/history')) { const samples=[]; for(let i=60;i>=0;i--){const t=Date.now()-i*10000;samples.push({time:new Date(t).toISOString(),cpu:20+Math.sin(i/5)*12,memory_mb:640+Math.sin(i/8)*40,memory_percent:(640+Math.sin(i/8)*40)/20.48,disk_mb:2960,disk_percent:19.3,uptime_seconds:100000});} return {period_minutes:60,samples}; }
    if(path==='/api/admin/cases') return {items:demoState.cases};
    if(/^\/api\/admin\/cases\/\d+$/.test(path)){const id=Number(path.split('/').pop());const row=demoState.cases.find(x=>x.id===id);return {case:row,evidence:[{id:1,message_id:4821,author_id:741852963,text:'Фрагмент сообщения, сохранённый до удаления.',media:[],created_at:row.created_at}],appeals:demoState.appeals.filter(x=>x.case_id===id)};}
    if(path==='/api/admin/appeals') return {items:demoState.appeals};
    if(path==='/api/admin/security/incidents') return {items:[{id:1,chat_id:-1001234567890,kind:'anti_raid',severity:'warning',status:'open',actor_id:null,details:{joins:11,window_seconds:30},created_at:new Date(Date.now()-600000).toISOString(),resolved_at:null},{id:2,chat_id:-1001234567890,kind:'admin_abuse',severity:'critical',status:'resolved',actor_id:555111222,details:{actions:12},created_at:new Date(Date.now()-86400000).toISOString(),resolved_at:new Date(Date.now()-82800000).toISOString()}]};
    if(path==='/api/admin/staff/probations') return {items:[{id:1,chat_id:-1001234567890,user_id:555111222,role:'junior_moderator',status:'active',starts_at:new Date(Date.now()-3*86400000).toISOString(),ends_at:new Date(Date.now()+4*86400000).toISOString(),actions_count:14,reversed_actions:1,complaints_count:0}]};
    if(path==='/api/admin/staff/performance') return {items:[{id:1,chat_id:-1001234567890,user_id:555111222,rating:92,actions_count:148,confirmed_actions:141,reversed_actions:3,accepted_appeals:2,complaints_count:1,suspended_until:null}]};
    if(path==='/api/admin/staff/shifts') return {items:demoState.shifts};
    if(path==='/api/admin/backups') return {items:demoState.backups};
    if(path==='/api/admin/weekly-reports') return {items:[]};
    if(path.includes('/weekly-report') && method==='POST') return {id:2,payload:{new_members:312,moderation_actions:126,reports:84,warnings:42,mutes:11,bans:3,appeals:5,accepted_appeals:1,top_moderator_id:555111222}};
    if(path.includes('/backups') && method==='POST' && !path.includes('/restore')) { const id=demoState.backups.length+1; demoState.backups.unshift({id,chat_id:-1001234567890,kind:'manual',checksum:'demo'+Date.now(),created_by:123456789,created_at:new Date().toISOString(),restored_at:null}); return {id,checksum:demoState.backups[0].checksum}; }
    if(path.includes('/cases/') && path.endsWith('/close') && method==='POST'){const id=Number(path.split('/')[4]);const row=demoState.cases.find(x=>x.id===id);if(row)row.status='closed';return {id,status:'closed'};}
    if(path.includes('/appeals/') && path.endsWith('/decision') && method==='POST'){const id=Number(path.split('/')[4]);const body=JSON.parse(options.body||'{}');const row=demoState.appeals.find(x=>x.id===id);if(row)row.status=body.decision==='accept'?'accepted':body.decision==='change'?'changed':'rejected';return {id,status:row?.status||'accepted'};}
    return {ok:true,id:Date.now(),status:'saved'};
  }

  async function api(path, options={}){
    if (DEMO_MODE) return demoApi(path, options);
    const headers = new Headers(options.headers || {});
    if (telegramInitData()) headers.set('X-Telegram-Init-Data', telegramInitData());
    else if (devUserId()) headers.set('X-Dev-User-Id', devUserId());
    if (options.body && !(options.body instanceof FormData)) headers.set('Content-Type', 'application/json');
    const response = await fetch(path, {...options, headers});
    if (!response.ok) {
      let message = `HTTP ${response.status}`;
      try { const body = await response.json(); message = body.detail || message; } catch (_) {}
      throw new Error(message);
    }
    if (response.status === 204) return null;
    return response.json();
  }

  function formatDate(value, withTime=true){
    if (!value || value === 'Навсегда') return value || null;
    const d = new Date(value);
    if (Number.isNaN(d.getTime())) return value;
    return d.toLocaleString('ru-RU', withTime ? {day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'} : {day:'2-digit',month:'2-digit',year:'numeric'});
  }

    data.liveIncidents = payload.incidents || [];

    setText('liveCpu', `${Number(r.cpu_percent || 0).toFixed(1)}%`);
    setText('liveCpuMeta', `${Number(r.cpu_limit || 4)} vCPU · ${resourceSourceLabel(r.cpu_source)} · обновление 1 сек.`);
    setText('liveRam', `${Number(r.memory_usage_mb || 0).toFixed(0)} МБ из ${Number(r.memory_limit_mb || 0).toFixed(0)} МБ`);
    setText('liveRamMeta', `${Number(r.memory_percent || 0).toFixed(1)}% · ${resourceSourceLabel(r.memory_source)}`);
    setText('liveDisk', `${(Number(r.disk_usage_mb || 0) / 1024).toFixed(3)} ГБ из ${(Number(r.disk_limit_mb || 0) / 1024).toFixed(0)} ГБ`);
    setText('liveDiskMeta', `${Number(r.disk_percent || 0).toFixed(2)}% лимита · только файлы AniGuard`);
    setText('liveUptime', r.uptime || '—');
    setText('liveProvider', resourceProviderLabel(r));
    setText('liveResourceStatus', r.error || 'API AniGuard через aniguard.bothost.tech · работает');
    setText('liveUpdated', payload.server_time ? new Date(payload.server_time).toLocaleTimeString('ru-RU') : '—');
    const dot = $('#resourceDot'); if (dot) dot.classList.toggle('degraded', r.status !== 'online');
    [['cpuBar',r.cpu_percent],['ramBar',r.memory_percent],['diskBar',r.disk_percent]].forEach(([id,value]) => { const node=$('#'+id); if(node){ node.className=`resource-bar ${resourceClass(Number(value||0))}`; const span=node.querySelector('span'); if(span) span.style.width=pct(value)+'%'; }});
    if (data.currentPage === 'overview') {
      setText('liveCasesCount', fmt(data.liveStats.cases || 0));
      setText('liveAppealsCount', fmt(data.liveStats.appeals || 0));
      setText('liveAlertsCount', fmt(data.liveStats.securityAlerts || 0));

    const me = await api('/api/me');

    const [dashboard, storeOverview] = await Promise.all([

  async function downloadExport(filename='aniguard_export.json'){
    const exportHeaders = {};
    if (telegramInitData()) exportHeaders['X-Telegram-Init-Data'] = telegramInitData();
    else if (devUserId()) exportHeaders['X-Dev-User-Id'] = devUserId();
    const response = await fetch('/api/admin/export', {headers:exportHeaders});
    if (!response.ok) {
      let msg = 'Не удалось сформировать файл';
      try { msg = (await response.json()).detail || msg; } catch (_) {}
      throw new Error(msg);
    }
    const blob = await response.blob();
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }

  function sparkline(samples, key, maxValue=100){
    if (!samples.length) return '<div class="card"><p>История появится после запуска мониторинга.</p></div>';
    const width=620, height=150, pad=10;
    const values=samples.map(item=>Number(item[key]||0));
    const max=Math.max(maxValue, ...values, 1);
    const points=values.map((value,index)=>`${pad+(width-pad*2)*(index/Math.max(1,values.length-1))},${height-pad-(height-pad*2)*(value/max)}`).join(' ');
    return `<svg viewBox="0 0 ${width} ${height}" style="width:100%;height:auto;border:1px solid var(--line);border-radius:18px;background:var(--card-2)"><polyline points="${points}" fill="none" stroke="var(--accent)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
  }

    openSheet('Резервные копии', 'Настройки, роли, правила и команды', `<div class="form"><div class="field"><label>Беседа</label><select id="backupChat">${chatOptions()}</select></div><button class="primary" id="createChatBackupBtn">Создать резервную копию</button></div><div class="section-head"><h2>История</h2><span>${payload.items.length}</span></div><div class="list">${payload.items.length?payload.items.map(row=>`<div class="row"><div class="row-icon">${icon('download')}</div><div class="row-copy"><span class="row-title">Копия #${row.id} · чат ${row.chat_id}</span><span class="row-sub">${formatDate(row.created_at)} · ${escapeHtml(row.checksum.slice(0,16))}</span></div><div class="row-extra"><button class="secondary" data-restore-backup="${row.id}">Восстановить</button></div></div>`).join(''):'<div class="card"><p>Копий пока нет.</p></div>'}</div>`);
  }

  function chatFeatureSheet(kind){
    const titleMap={ladder:'Лестница наказаний',permissions:'Индивидуальные права',antiraid:'Антирейд',emergency:'Экстренный режим',testmode:'Тестовый режим',rules:'Конструктор правил',chatinfo:'Карточка беседы',style:'Стиль ответов',weekly:'Еженедельный отчёт'};
    const title=titleMap[kind]||'Настройка беседы';
    let body=`<div class="field"><label>Беседа</label><select id="opsChatSelect">${chatOptions()}</select></div>`;
    if(kind==='ladder') body+=`<label class="switch-line"><input id="opsLadderEnabled" type="checkbox" checked><span>Лестница включена</span></label><div class="field"><label>Шаги JSON</label><textarea id="opsLadderSteps" rows="10">${escapeHtml(JSON.stringify([{warnings:1,action:'warn',duration_seconds:0,label:'Предупреждение'},{warnings:2,action:'mute',duration_seconds:1800,label:'Мут 30 минут'},{warnings:3,action:'penalty_violator',duration_seconds:604800,label:'Нарушитель'},{warnings:4,action:'mute',duration_seconds:86400,label:'Мут 24 часа'},{warnings:5,action:'penalty_severe',duration_seconds:2592000,label:'Злостный нарушитель'},{warnings:6,action:'ban',duration_seconds:0,label:'Бан'}],null,2))}</textarea></div><button class="primary" id="saveLadderBtn">Сохранить</button>`;
    if(kind==='permissions') body+=`<div class="field"><label>ID сотрудника</label><input id="opsPermissionUser" type="number"></div><div class="field"><label>Действие</label><select id="opsPermissionName"><option value="warn">Предупреждения</option><option value="mute">Мут</option><option value="ban">Бан</option><option value="unban">Разбан</option><option value="kick">Кик</option><option value="role_change">Роли</option></select></div><label class="switch-line"><input id="opsPermissionAllowed" type="checkbox" checked><span>Разрешено</span></label><div class="field"><label>Максимальный срок, секунд</label><input id="opsPermissionLimit" type="number" min="0"></div><button class="primary" id="savePermissionBtn">Сохранить право</button>`;
    if(kind==='antiraid'||kind==='emergency'||kind==='testmode') body+=`<label class="switch-line"><input id="opsModeEnabled" type="checkbox" checked><span>Включить режим</span></label><div class="field"><label>Причина</label><textarea id="opsModeReason"></textarea></div>${kind==='emergency'?'<div class="field"><label>Срок, секунд</label><input id="opsModeDuration" type="number" value="3600"></div>':''}<button class="primary" data-save-mode="${kind}">Применить</button>`;
    if(kind==='weekly') body+=`<button class="primary" id="generateWeeklyBtn">Сформировать отчёт</button><div id="weeklyResult"></div>`;
    if(kind==='style') body+=`<div class="field"><label>Стиль</label><select id="opsResponseStyle"><option value="ordinary">Обычный</option><option value="naruto">Naruto</option><option value="minimal">Минималистичный</option><option value="strict">Строгий</option></select></div><div class="field"><label>Длина</label><select id="opsResponseLength"><option value="full">Полная</option><option value="short">Краткая</option></select></div><label class="switch-line"><input id="opsDeleteCommand" type="checkbox"><span>Удалять команду пользователя</span></label><label class="switch-line"><input id="opsReplyThread" type="checkbox"><span>Отвечать в теме</span></label><button class="primary" id="saveResponseStyleBtn">Сохранить</button>`;
    if(kind==='rules') body+=`<div class="card"><h3>Конструктор доступен в панели группы</h3><p>Выберите беседу и откройте её Mini App. Правила сохраняются сервером в таблице moderation_rules.</p></div><button class="primary" id="openRulesPanelBtn">Открыть конструктор</button>`;
    if(kind==='chatinfo') { const chat=data.chats[0]; body+=`<div id="opsChatInfo" class="facts" style="margin-top:10px"></div><button class="primary" id="refreshChatInfoBtn">Показать карточку</button>`; }
    openSheet(title,'Настройка выбранной беседы',`<div class="form">${body}</div>`);
  }

  async function handleAction(name){

    if (name === 'coin-manager') coinsForm();
    if (name === 'broadcast') broadcastSheet();
    if (name === 'reports') reportsSheet();
    if (name === 'promos') promosSheet();
    if (name === 'payments') paymentsSheet();
    if (name === 'export-report') exportSheet();
    if (name === 'security-log') securitySheet();
    if (name === 'tickets') ticketsSheet();
    if (name === 'store-ads') await storeAdsSheet();
    if (name === 'support-inbox') await supportInboxSheet();
    if (name === 'case-history') await caseHistorySheet();
    if (name === 'wallet-history') await walletHistorySheet();
    if (name === 'advertising-settings') advertisingSettingsSheet();
    if (name === 'backup') backupSheet();
    if (name === 'danger-zone') dangerSheet();
    if (name === 'gift-pack') giftPackSheet();
    if (name === 'global-ban') globalBanSheet();
    if (name === 'ops-cases') await operationsCasesSheet();
    if (name === 'ops-appeals') await operationsAppealsSheet();
    if (name === 'ops-resources-history') await resourcesHistorySheet();
    if (name === 'ops-probations') await probationsSheet();
    if (name === 'ops-performance') await performanceSheet();
    if (name === 'ops-abuse') await securityIncidentsSheet('admin_abuse');
    if (name === 'ops-evidence') await operationsCasesSheet();
    if (name === 'ops-shifts') await shiftsSheet();
    if (name === 'ops-backups') await backupsOperationsSheet();
    if (name === 'ops-ladder') chatFeatureSheet('ladder');
    if (name === 'ops-permissions') chatFeatureSheet('permissions');
    if (name === 'ops-antiraid') chatFeatureSheet('antiraid');
    if (name === 'ops-emergency') chatFeatureSheet('emergency');
    if (name === 'ops-testmode') chatFeatureSheet('testmode');
    if (name === 'ops-weekly') chatFeatureSheet('weekly');
    if (name === 'ops-rules') chatFeatureSheet('rules');
    if (name === 'ops-chatinfo') chatFeatureSheet('chatinfo');
    if (name === 'ops-style') chatFeatureSheet('style');
    if (name === 'bulk-premium') {
      openSheet('Массовое продление', 'Для выбранной категории Premium', `
        <div class="form">
          <div class="field">
            <label>Категория</label>
            <select id="bulkCategory">
              <option>Все Premium-пользователи</option>
              <option>Истекают за 7 дней</option>
              <option>Premium бесед</option>
            </select>
          </div>
          <div class="field">
            <label>Добавить дней</label>
            <input id="bulkDays" type="number" value="7">
          </div>
          <button id="bulkPremiumBtn" class="primary">Продлить</button>
        </div>
      `);
    }
    if (name === 'logout') {
      closeSheet();
      $('#appScreen').classList.add('hidden');
      $('#authScreen').classList.remove('hidden');
      $('#passwordInput').value = '';
      clearInterval(data.liveTimer);
      showToast('Вы вышли из панели');
    }
  }

  function initEvents(){
    $('#loginBtn').addEventListener('click', login);
    $('#themeAuthBtn').addEventListener('click', toggleTheme);
    $('#themeBtn').addEventListener('click', toggleTheme);
    $('#refreshBtn').addEventListener('click', async () => {
      try { await reloadRemoteData(); } catch (e) { showToast(e.message); }
    });
    $('#menuBtn').addEventListener('click', menuSheet);
    $('#adminChip').addEventListener('click', () => {
      openSheet('AniGuard Admin', 'Профиль администратора', `
        <div class="profile-hero">
          ${avatarMarkup(data.admin.name || 'AniGuard Admin', data.admin.avatar_url || '', true)}
          <div style="min-width:0">
            <div class="profile-name">${data.admin.name || 'AniGuard Admin'}</div>
            <span class="profile-id">Telegram ID: ${data.admin.id || '—'}</span>
            <span class="profile-username">@${data.admin.username || 'без_username'} · маршрут /admin</span>
          </div>
        </div>
        <div class="form" style="margin-top:14px">
          <div class="field">
            <label for="adminAvatarInput">Аватар администратора</label>
            <input id="adminAvatarInput" type="file" accept="image/jpeg,image/png,image/webp">
          </div>
          <button class="primary" id="uploadAdminAvatarBtn">Сохранить аватар</button>
          ${data.admin.avatar_url ? '<button class="danger" id="deleteAdminAvatarBtn">Удалить аватар</button>' : ''}
        </div>
        <button class="secondary" id="profileThemeBtn" style="margin-top:14px">Сменить тему</button>
        <button class="danger" data-action="logout" style="margin-top:10px">Закрыть панель</button>
      `);
    });

    $$('.nav-btn').forEach(btn => btn.addEventListener('click', () => switchPage(btn.dataset.page)));
    $('#searchInput').addEventListener('input', () => {
      if (data.currentPage === 'users') renderUsers();
      if (data.currentPage === 'chats') renderChats();
    });
    $('#sheetClose').addEventListener('click', closeSheet);
    $('#sheetBackdrop').addEventListener('click', e => { if (e.target === $('#sheetBackdrop')) closeSheet(); });

    document.addEventListener('click', async (e) => {
      try {
        const actionNode = e.target.closest('[data-action]');
        if (actionNode) await handleAction(actionNode.dataset.action);

        const opsCaseNode = e.target.closest('[data-ops-case]');
        if (opsCaseNode) await operationCaseDetails(Number(opsCaseNode.dataset.opsCase));

        const closeCaseNode = e.target.closest('[data-close-case]');
        if (closeCaseNode) {
          await post(`/api/admin/cases/${Number(closeCaseNode.dataset.closeCase)}/close`, {status:'closed'});
          await operationsCasesSheet();
          showToast('Дело закрыто');
        }

        const opsAppealNode = e.target.closest('[data-ops-appeal]');
        if (opsAppealNode) await operationAppealDetails(Number(opsAppealNode.dataset.opsAppeal));

        const appealDecisionNode = e.target.closest('[data-appeal-decision]');
        if (appealDecisionNode) {
          await post(`/api/admin/appeals/${Number(appealDecisionNode.dataset.appealId)}/decision`, {
            decision: appealDecisionNode.dataset.appealDecision,
            note: $('#appealDecisionNote')?.value.trim() || ''
          });
          await operationsAppealsSheet();
          showToast('Решение по апелляции сохранено');
        }

        const probationDecisionNode = e.target.closest('[data-probation-decision]');
        if (probationDecisionNode) {
          await post(`/api/admin/staff/probations/${Number(probationDecisionNode.dataset.probationId)}/decision`, {
            decision: probationDecisionNode.dataset.probationDecision,
            note: ''
          });
          await probationsSheet();
          showToast('Решение по испытательному сроку сохранено');
        }

        if (e.target.id === 'createShiftBtn') {
          const chatId = Number($('#shiftChat')?.value || 0);
          const userId = Number($('#shiftUser')?.value || 0);
          const startsAt = $('#shiftStart')?.value;
          const endsAt = $('#shiftEnd')?.value;
          if (!chatId || !userId || !startsAt || !endsAt) throw new Error('Заполните беседу, модератора и время смены');
          await post(`/api/admin/chats/${chatId}/shifts`, {user_id:userId, starts_at:new Date(startsAt).toISOString(), ends_at:new Date(endsAt).toISOString(), temporary_role:'moderator'});
          await shiftsSheet();
          showToast('Смена назначена');
        }

        if (e.target.id === 'createChatBackupBtn') {
          const chatId = Number($('#backupChat')?.value || 0);
          if (!chatId) throw new Error('Выберите беседу');
          await post(`/api/admin/chats/${chatId}/backups`, {});
          await backupsOperationsSheet();
          showToast('Резервная копия создана');
        }

        const restoreBackupNode = e.target.closest('[data-restore-backup]');
        if (restoreBackupNode) {
          await post(`/api/admin/backups/${Number(restoreBackupNode.dataset.restoreBackup)}/restore`, {confirm:true});
          await backupsOperationsSheet();
          showToast('Настройки восстановлены');
        }

        const saveModeNode = e.target.closest('[data-save-mode]');
        if (saveModeNode) {
          const chatId = Number($('#opsChatSelect')?.value || 0);
          if (!chatId) throw new Error('Выберите беседу');
          const kind = saveModeNode.dataset.saveMode;
          const path = kind === 'antiraid' ? 'anti-raid' : kind === 'testmode' ? 'test-mode' : 'emergency';
          const payload = {
            enabled: Boolean($('#opsModeEnabled')?.checked),
            reason: $('#opsModeReason')?.value.trim() || ''
          };
          if (kind === 'emergency') payload.duration_seconds = Math.max(0, Number($('#opsModeDuration')?.value || 3600));
          await post(`/api/admin/chats/${chatId}/${path}`, payload);
          showToast('Режим обновлён');
        }

        if (e.target.id === 'saveLadderBtn') {
          const chatId = Number($('#opsChatSelect')?.value || 0);
          if (!chatId) throw new Error('Выберите беседу');
          let steps;
          try { steps = JSON.parse($('#opsLadderSteps')?.value || '[]'); } catch { throw new Error('Некорректный JSON лестницы наказаний'); }
          if (!Array.isArray(steps)) throw new Error('Шаги должны быть массивом');
          await api(`/api/admin/chats/${chatId}/punishment-ladder`, {method:'PUT', body:JSON.stringify({enabled:Boolean($('#opsLadderEnabled')?.checked), steps})});
          showToast('Лестница наказаний сохранена');
        }

        if (e.target.id === 'savePermissionBtn') {
          const chatId = Number($('#opsChatSelect')?.value || 0);
          const userId = Number($('#opsPermissionUser')?.value || 0);
          if (!chatId || !userId) throw new Error('Выберите беседу и укажите ID сотрудника');
          const limitRaw = $('#opsPermissionLimit')?.value;
          await api(`/api/admin/chats/${chatId}/permission-overrides`, {method:'PUT', body:JSON.stringify({
            user_id:userId,
            permission:$('#opsPermissionName')?.value || 'warn',
            allowed:Boolean($('#opsPermissionAllowed')?.checked),
            limit_value:limitRaw === '' ? null : Math.max(0, Number(limitRaw)),
            expires_seconds:null
          })});
          showToast('Индивидуальное право сохранено');
        }

        if (e.target.id === 'generateWeeklyBtn') {
          const chatId = Number($('#opsChatSelect')?.value || 0);
          if (!chatId) throw new Error('Выберите беседу');
          const result = await post(`/api/admin/chats/${chatId}/weekly-report`, {});
          const box = $('#weeklyResult');
          if (box) box.innerHTML = `<div class="card" style="margin-top:12px"><h3>Отчёт сформирован</h3><pre style="white-space:pre-wrap">${escapeHtml(JSON.stringify(result.payload,null,2))}</pre></div>`;
          showToast('Еженедельный отчёт готов');
        }

        if (e.target.id === 'saveResponseStyleBtn') {
          const chatId = Number($('#opsChatSelect')?.value || 0);
          if (!chatId) throw new Error('Выберите беседу');
          await api(`/api/admin/chats/${chatId}/response-style`, {method:'PUT', body:JSON.stringify({
            style:$('#opsResponseStyle')?.value || 'ordinary',
            length:$('#opsResponseLength')?.value || 'full',
            delete_command_message:Boolean($('#opsDeleteCommand')?.checked),
            reply_in_thread:Boolean($('#opsReplyThread')?.checked)
          })});
          showToast('Стиль ответов сохранён');
        }

        if (e.target.id === 'openRulesPanelBtn') {
          const chatId = Number($('#opsChatSelect')?.value || 0);
          if (!chatId) throw new Error('Выберите беседу');
          window.location.href = `/panel?chat_id=${encodeURIComponent(chatId)}`;
        }

        if (e.target.id === 'refreshChatInfoBtn') {
          const chatId = Number($('#opsChatSelect')?.value || 0);
          const chat = chatById(chatId);
          if (!chat) throw new Error('Беседа не найдена');
          const box = $('#opsChatInfo');
          if (box) box.innerHTML = `
            <div class="fact"><small>Название</small><b>${escapeHtml(chat.name)}</b></div>
            <div class="fact"><small>ID</small><b>${chat.id}</b></div>
            <div class="fact"><small>Участников</small><b>${fmt(chat.members)}</b></div>
            <div class="fact"><small>Активных за неделю</small><b>${fmt(chat.active7)}</b></div>
            <div class="fact"><small>Бот</small><b>${escapeHtml(chat.botStatus)}</b></div>
            <div class="fact"><small>Защита</small><b>${chat.antiSpam ? 'Антиспам включён' : 'Базовая'}</b></div>`;
        }

        const userNode = e.target.closest('[data-user-action],[data-user-sheet]');
        if (userNode) {
          const user = userById(userNode.dataset.id);
          const action = userNode.dataset.userAction || userNode.dataset.userSheet;
          if (!user) return;
          if (action === 'info') userProfileSheet(user);
          if (action === 'premium') premiumForm('user', user.id);
          if (action === 'coins') coinsForm(user.id);
          if (action === 'refs') refsSheet(user);
          if (action === 'block') {
            await post('/api/admin/block', {entity_type:'user', entity_id:user.id, blocked:!user.blocked, reason:'Из админ-панели'});
            if (userNode.dataset.userSheet) closeSheet();
            await reloadRemoteData(user.blocked ? 'Пользователь разблокирован' : 'Пользователь заблокирован');
          }
        }

        const chatNode = e.target.closest('[data-chat-action],[data-chat-sheet]');
        if (chatNode) {
          const chat = chatById(chatNode.dataset.id);
          const action = chatNode.dataset.chatAction || chatNode.dataset.chatSheet;
          if (!chat) return;
          if (action === 'info') chatInfoSheet(chat);
          if (action === 'premium') premiumForm('chat', chat.id);
          if (action === 'settings') chatSettingsSheet(chat);
          if (action === 'journal') chatJournalSheet(chat);
          if (action === 'toggle') {
            const active = chat.botStatus !== 'Активен';
            await post(`/api/admin/chats/${chat.id}/state`, {active});
            if (chatNode.dataset.chatSheet) closeSheet();
            await reloadRemoteData(active ? 'Бот запущен в беседе' : 'Бот приостановлен в беседе');
          }
        }

        const ticketNode = e.target.closest('[data-ticket]');
        if (ticketNode) {
          const ticket = data.tickets.find(t => t.id === ticketNode.dataset.ticket);
          if (ticket) ticketDetailSheet(ticket);
        }

        const adOrderNode = e.target.closest('[data-ad-order]');
        if (adOrderNode) {
          const order = data.storeAds.find(item => item.id === Number(adOrderNode.dataset.adOrder));
          if (order) adOrderDetailSheet(order);
        }

        const adDecision = e.target.closest('[data-ad-decision]');
        if (adDecision) {
          await post(`/api/admin/store/ads/${Number(adDecision.dataset.orderId)}/moderate`, {decision:adDecision.dataset.adDecision, note:$('#adModerationNote')?.value.trim() || ''});
          closeSheet();
          await reloadRemoteData(adDecision.dataset.adDecision === 'approve' ? 'Реклама одобрена' : 'Реклама отклонена');
          await storeAdsSheet();
        }

        const supportTicketNode = e.target.closest('[data-support-ticket]');
        if (supportTicketNode) {
          const ticket = data.supportTickets.find(item => item.id === Number(supportTicketNode.dataset.supportTicket));
          if (ticket) supportTicketDetailSheet(ticket);
        }

        const supportReply = e.target.closest('[data-support-reply]');
        if (supportReply) {
          const reply = $('#supportAdminReply')?.value.trim();
          if (!reply) throw new Error('Введите ответ пользователю');
          await post(`/api/admin/support/tickets/${Number(supportReply.dataset.supportReply)}/reply`, {text:reply});
          await reloadRemoteData('Ответ отправлен пользователю');
          await supportInboxSheet();
        }

        const supportClose = e.target.closest('[data-support-close]');
        if (supportClose) {
          await post(`/api/admin/support/tickets/${Number(supportClose.dataset.supportClose)}/status`, {status:'closed'});
          await reloadRemoteData('Обращение закрыто');
          await supportInboxSheet();
        }

        if (e.target.id === 'savePremiumBtn') {
          const entityType = $('#premiumTargetType').value;
          const entityId = Number($('#premiumTargetId').value.trim());
          if (!entityId) throw new Error('Укажите корректный Telegram ID');
          await post('/api/admin/premium', {
            entity_type:entityType, entity_id:entityId, days:Number($('#premiumDays').value),
            permanent:false, plan:'admin', note:$('#premiumComment').value.trim() || $('#premiumSource').value
          });
          closeSheet(); await reloadRemoteData('Premium выдан');
        }

        if (e.target.id === 'saveCoinBtn') {
          const userId = Number($('#coinUserId').value.trim());
          if (!userId) throw new Error('Укажите корректный ID пользователя');
          await post('/api/admin/coins', {
            user_id:userId, operation:$('#coinOperation').value,
            amount:Math.max(0, Number($('#coinValue').value || 0)), note:$('#coinReason').value.trim()
          });
          closeSheet(); await reloadRemoteData('Баланс AniCoin обновлён');
        }

        if (e.target.id === 'previewBroadcastBtn') {
          const text = $('#broadcastText').value.trim() || 'Текст сообщения';
          const btnText = $('#broadcastButton').value.trim();
          const box = $('#broadcastPreviewBox'); box.classList.remove('hidden');
          box.innerHTML = `<h3>Предпросмотр</h3><p style="margin-top:8px;white-space:pre-wrap">${text}</p>${btnText ? `<button class="primary" style="margin-top:12px">${btnText}</button>` : ''}`;
        }

        if (e.target.id === 'saveBroadcastBtn') {
          const text = $('#broadcastText').value.trim();
          if (!text) throw new Error('Введите текст рассылки');
          const audienceMap = {'Все пользователи':'users','Активные за 7 дней':'active_users','Premium-пользователи':'premium_users','Владельцы бесед':'chat_owners'};
          await post('/api/admin/broadcast', {
            audience:audienceMap[$('#broadcastAudience').value] || 'users', text,
            button_text:$('#broadcastButton').value.trim() || null,
            button_url:$('#broadcastLink').value.trim() || null
          });
          closeSheet(); await reloadRemoteData('Рассылка добавлена в очередь');
        }

        if (e.target.id === 'createPromoBtn') {
          const kind = $('#promoKind').value;
          const value = Number(kind === 'premium' ? $('#promoDaysValue').value : $('#promoCoinValue').value);
          const result = await post('/api/admin/promos', {reward_type:kind === 'premium' ? 'premium' : 'coins', reward_value:value, max_uses:Math.max(1, Number($('#promoLimit').value || 100))});
          closeSheet(); await reloadRemoteData(`Создан промокод ${result.code}`);
        }

        if (e.target.id === 'doExportBtn') {
          await downloadExport(); closeSheet(); showToast('Отчёт сформирован');
        }

        if (e.target.id === 'globalBanBtn') {
          let target = $('#globalBanTarget').value.trim();
          if (target.startsWith('@')) {
            const found = data.users.find(u => u.username.toLowerCase() === target.slice(1).toLowerCase());
            if (!found) throw new Error('Пользователь с таким username не найден в базе');
            target = String(found.id);
          }
          const id = Number(target); if (!id) throw new Error('Укажите ID или известный @username');
          await post('/api/admin/block', {entity_type:id < 0 ? 'chat' : 'user', entity_id:id, blocked:true, reason:$('#globalBanReason').value.trim() || 'Глобальная блокировка'});
          closeSheet(); await reloadRemoteData('Глобальная блокировка применена');
        }

        if (e.target.id === 'replyTicketBtn') {
          const ticket = data.tickets.find(t => t.id === e.target.dataset.ticketId);
          const reply = $('#ticketReply').value.trim();
          if (!reply) throw new Error('Введите ответ');
          if (!ticket) throw new Error('Тикет не найден');
          await post(`/api/admin/users/${ticket.userId}/message`, {text:reply});
          await post(`/api/admin/reports/${ticket.rawId}/status`, {status:'closed'});
          closeSheet(); await reloadRemoteData('Ответ отправлен, обращение закрыто');
        }

        if (e.target.id === 'createBackupBtn') {
          await downloadExport('aniguard_backup.json'); closeSheet(); showToast('Резервная копия создана');
        }
        if (e.target.id === 'restartBtn') {
          await post('/api/admin/system/action/restart', {}); closeSheet(); showToast('Команда перезапуска отправлена');
        }
        if (e.target.id === 'clearCacheBtn') {
          await post('/api/admin/system/action/clear_cache', {}); localStorage.removeItem('aniguard_admin_theme'); closeSheet(); showToast('Локальный кэш очищен');
        }
        if (e.target.id === 'maintenanceBtn') {
          await post('/api/admin/system/action/maintenance', {}); closeSheet(); await reloadRemoteData('Технический режим включён');
        }
        if (e.target.id === 'bulkPremiumBtn') {
          const days = Math.max(1, Number($('#bulkDays').value || 7));
          const category = $('#bulkCategory').value;
          const categoryMap = {'Все Premium-пользователи':'premium_users','Истекают за 7 дней':'expiring_users','Premium бесед':'premium_chats'};
          const result = await post('/api/admin/premium/bulk', {category:categoryMap[category] || 'premium_users', days});
          closeSheet(); await reloadRemoteData(`Продлено подписок: ${result.count}`);
        }
        if (e.target.id === 'saveAdvertisingSettings') {
          const channelLiveUsers = Math.max(0, Number($('#channelLiveUsers')?.value || 0));
          await post('/api/admin/store/advertising-settings', {channel_live_users:channelLiveUsers});
          closeSheet();
          await reloadRemoteData('Настройки рекламы сохранены');
        }

        if (e.target.id === 'uploadAdminAvatarBtn') {
          const file = $('#adminAvatarInput')?.files?.[0];
          if (!file) throw new Error('Выберите JPG, PNG или WEBP');
          const form = new FormData();
          form.append('avatar', file);
          await api('/api/admin/profile/avatar', {method:'POST', body:form});
          closeSheet(); await reloadRemoteData('Аватар администратора сохранён');
        }
        if (e.target.id === 'deleteAdminAvatarBtn') {
          await api('/api/admin/profile/avatar', {method:'DELETE'});
          closeSheet(); await reloadRemoteData('Аватар администратора удалён');
        }
        if (e.target.id === 'profileThemeBtn') { toggleTheme(); closeSheet(); }
      } catch (err) { showToast(err.message || 'Ошибка'); }
    });

    document.addEventListener('input', e => { if (e.target.id === 'paymentSearch') refreshPaymentsList(e.target.value); });
    document.addEventListener('change', async (e) => {
      try {
        if (e.target.id === 'promoKind') togglePromoFields();
        if (e.target.matches('[data-setting]')) {
          data.settings[e.target.dataset.setting] = e.target.checked;
          await post('/api/admin/system/settings', {settings:{[e.target.dataset.setting]:e.target.checked}});
          showToast('Настройка сохранена');
        }
        if (e.target.matches('[data-promo-toggle]')) {
          const promo = data.promos[Number(e.target.dataset.promoToggle)];
          if (promo) await post(`/api/admin/promos/${promo.code}/toggle`, {active:e.target.checked});
          await reloadRemoteData('Статус промокода обновлён');
        }
        if (e.target.matches('[data-chat-toggle-field]')) {
          const chat = chatById(e.target.dataset.id); if (!chat) return;
          const field = e.target.dataset.chatToggleField;
          await post(`/api/admin/chats/${chat.id}/settings`, {[field]:e.target.checked});
          await reloadRemoteData('Настройка беседы обновлена');
          chatSettingsSheet(chatById(chat.id));
        }
      } catch (err) { showToast(err.message || 'Ошибка'); }
    });
  }

  async function login(){
    $('#authError').textContent = '';
    $('#loginBtn').disabled = true;
    try {
      tg?.ready(); tg?.expand();
      await loadRemoteData();
      $('#authScreen').classList.add('hidden');
      $('#appScreen').classList.remove('hidden');
      startLiveUpdates();
      showToast('Авторизация успешна');
    } catch (err) {
      $('#authError').textContent = err.message || 'Не удалось проверить доступ';
    } finally {
      $('#loginBtn').disabled = false;
    }
  }

  async function init(){
    applyTheme(data.theme);
    initEvents();
    tg?.ready(); tg?.expand();
    await login();
  }

  init();
})();
</script>
</body>
</html>
